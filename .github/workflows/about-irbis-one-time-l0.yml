name: ABOUT-IRBIS one-time localization source census
on:
  pull_request:
    paths:
      - '.github/workflows/about-irbis-one-time-l0.yml'
permissions:
  contents: write
jobs:
  refresh-l0:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'feature/about-fullbleed-vector-footer-layout-20261020'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --prefix scripts/localization --ignore-scripts --no-audit --no-fund
      - run: node scripts/localization/inventory.cjs
      - name: Commit generated inventory only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/localization/l0/
          if ! git diff --cached --quiet; then
            git commit -m "chore(localization): refresh census for About / Irbis presentation only"
            git push origin "HEAD:${{ github.head_ref }}"
          fi
