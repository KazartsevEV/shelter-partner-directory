name: Temporary 7B-2 localization inventory
on:
  push:
    branches:
      - feature/sales-tax-7b-2-goods-v1
    paths:
      - .github/workflows/refresh-7b2-inventory.yml
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/sales-tax-7b-2-goods-v1
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --prefix scripts/localization
      - run: node scripts/localization/inventory.cjs
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/localization/l0
          if ! git diff --cached --quiet; then
            git commit -m "chore(l10n): update L0 inventory for 7B-2 isolated module"
            git push origin HEAD:feature/sales-tax-7b-2-goods-v1
          fi
