name: Temporary consulting L0 inventory refresh
on:
  push:
    branches:
      - feature/consulting-b2b-value-proposition
    paths:
      - .github/workflows/refresh-consulting-inventory.yml
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/consulting-b2b-value-proposition
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned inventory dependencies
        run: npm ci --prefix scripts/localization
      - name: Rebuild generated locale source inventory
        run: node scripts/localization/inventory.cjs
      - name: Commit only generated L0 artifacts to PR branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/localization/l0
          if ! git diff --cached --quiet; then
            git commit -m "chore(l10n): regenerate L0 census for consulting copy"
            git push origin HEAD:feature/consulting-b2b-value-proposition
          fi
