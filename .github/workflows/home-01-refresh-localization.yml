name: HOME-01 one-time L0 refresh
on:
  pull_request:
    paths:
      - '.github/workflows/home-01-refresh-localization.yml'
permissions:
  contents: write
jobs:
  update-l0:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'feature/home-workspace-compact-five-rows-20261020'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install current localization tools
        run: npm ci --prefix scripts/localization --ignore-scripts --no-audit --no-fund
      - name: Regenerate L0 from changed JS
        run: node scripts/localization/inventory.cjs
      - name: Commit only generated localization files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/localization/l0/
          if git diff --cached --quiet; then
            echo "L0 census already current"
          else
            git commit -m "chore(localization): refresh HOME-01 UI labels in full canonical census"
            git push origin "HEAD:${{ github.head_ref }}"
          fi
