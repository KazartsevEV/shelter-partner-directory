name: Localization source, semantic compatibility and browser census
on:
  pull_request:
    paths:
      - 'scripts/localization/**'
      - 'docs/localization/**'
      - 'tests/nomad360_localization_*'
      - 'tests/nomad360_locale_semantic.test.cjs'
      - 'nomad360_locale_core.js'
      - 'Marketing_calc.HTML'
      - '.github/workflows/localization-l0.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --prefix scripts/localization --ignore-scripts --no-audit --no-fund
      - name: Syntax, deterministic inventory and extraction regressions
        run: |
          node --check scripts/localization/inventory.cjs
          node --check tests/nomad360_localization_l0_browser.cjs
          node scripts/localization/inventory.cjs --check
          node tests/nomad360_localization_inventory.test.cjs
          node tests/nomad360_locale_diagnostics.test.cjs
      - name: Semantic compatibility and unchanged financial code against accepted Excel merge
        run: node tests/nomad360_locale_semantic.test.cjs
      - run: npm install --no-save --package-lock=false playwright@1.58.0 tailwindcss@3.4.17
      - run: npx playwright install --with-deps chromium
      - name: Offline CSS for browser census
        run: |
          mkdir -p artifacts
          printf '@tailwind base;\n@tailwind components;\n@tailwind utilities;\n' > /tmp/l0-utilities.css
          npx tailwindcss -i /tmp/l0-utilities.css --content './Marketing_calc.HTML,./nomad360_*.js,./portfolio_v2_*ui.js' -o artifacts/l0-utilities.css --minify
      - run: node tests/nomad360_localization_l0_browser.cjs
        env:
          NOMAD360_LOCALE_ACCEPTANCE: '1'
      - run: node tests/nomad360_localization_acceptance_browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: localization-l0-browser-census
          path: |
            artifacts/localization-l0
            artifacts/localization-acceptance
          retention-days: 14
