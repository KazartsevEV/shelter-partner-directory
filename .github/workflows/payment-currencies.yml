name: Actual payment currencies acceptance
on:
  pull_request:
    paths:
      - 'Marketing_calc.HTML'
      - 'nomad360_currency.js'
      - 'nomad360_payment*'
      - 'nomad360_locale_core.js'
      - 'portfolio_v2_ui.js'
      - 'tests/nomad360_payments*.cjs'
      - '.github/workflows/payment-currencies.yml'
jobs:
  payments:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock playwright@1.58.0 tailwindcss@3.4.17
      - run: npx playwright install --with-deps chromium
      - name: Syntax and isolated actual-payment contracts
        run: |
          node --check nomad360_payments.js
          node --check nomad360_payment_ui.js
          node --check nomad360_locale_core.js
          node --check portfolio_v2_ui.js
          node -e "const fs=require('fs');for(const m of fs.readFileSync('Marketing_calc.HTML','utf8').matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/g))new Function(m[1]);"
          node --test tests/nomad360_payments.test.cjs tests/nomad360_currency.test.cjs tests/calculator_business_oracle_v2.test.cjs tests/portfolio_v2_v1_parity.test.cjs
      - name: Compile existing offline styles
        run: |
          mkdir -p artifacts/payments
          printf '@tailwind base;\n@tailwind components;\n@tailwind utilities;\n' > /tmp/payment-utilities.css
          npx tailwindcss -i /tmp/payment-utilities.css -o artifacts/payment-utilities.css --content './Marketing_calc.HTML,./portfolio_v2_*ui.js,./nomad360_*.js'
      - name: Prove the edit regression fails on the rejected PR revision
        run: |
          mkdir -p /tmp/payment-rejected/artifacts
          git archive 125634d4641910c731331929c93135e0e2bea1c0 | tar -x -C /tmp/payment-rejected
          cp tests/nomad360_payments_browser.test.cjs /tmp/payment-rejected/tests/
          cp artifacts/payment-utilities.css /tmp/payment-rejected/artifacts/
          export NODE_PATH="$GITHUB_WORKSPACE/node_modules"
          if node /tmp/payment-rejected/tests/nomad360_payments_browser.test.cjs --edit-only > artifacts/payments/edit-baseline-red.log 2>&1; then
            cat artifacts/payments/edit-baseline-red.log
            echo 'Rejected revision unexpectedly passed the edit regression'
            exit 1
          fi
          node -e "const s=require('fs').readFileSync('artifacts/payments/edit-baseline-red.log','utf8');if(!s.includes('V2_EDIT_AUTOSAVE resale/unitCost live metadata')||!s.includes('20')||!s.includes('35'))throw Error('Expected stale-payment assertion was not reproduced');console.log('PAYMENT_EDIT_BASELINE_RED_CONFIRMED')"
      - name: Chromium amounts, currencies, restore, languages and responsive forms
        run: node tests/nomad360_payments_browser.test.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: payment-currencies-browser
          path: artifacts/payments
          retention-days: 14
