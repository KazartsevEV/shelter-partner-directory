name: Nomad360 task 09 bug report widget
on:
  pull_request:
    paths:
      - 'Marketing_calc.HTML'
      - 'nomad360_bug_report.js'
      - 'nomad360_bug_report.css'
      - 'tests/nomad360_bug_report_browser.cjs'
      - 'docs/reviews/bug-report-09/**'
      - '.github/workflows/bug-report-09.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  report-source-and-vat-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reject finance edits, private state transport and unapproved destinations
        run: |
          node --check nomad360_bug_report.js
          node --check tests/nomad360_bug_report_browser.cjs
          git fetch --no-tags origin main
          git diff --name-only origin/main...HEAD | tee /tmp/bug09-changed
          if grep -E '^(portfolio_v2_|nomad360_sales_tax|nomad360_price_export|nomad360_calculator_ui|tests/fixtures/sales-tax-7b|docs/reviews/sales-tax-7b)' /tmp/bug09-changed; then
            echo "Protected finance or VAT modified" >&2
            exit 1
          fi
          if grep -Ei '(root|window|document)\.(localStorage|sessionStorage|cookie)|navigator\.sendBeacon|location\.(search|href)' nomad360_bug_report.js; then
            echo "Private state or URL transfer in widget" >&2
            exit 1
          fi
          # Do not modify frozen application HTML; the Formspree ID is public and scoped to the widget.
          if grep -q 'data-nomad-bug-endpoint=' Marketing_calc.HTML; then
            echo "Do not modify protected calculator HTML to configure the handler" >&2; exit 1
          fi
          if ! grep -Fq "const APPROVED_FORM_ID='mwlvadod';" nomad360_bug_report.js; then
            echo "Owner-approved public routing ID missing/changed" >&2; exit 1
          fi
          if ! grep -Fq "referrerPolicy:'strict-origin-when-cross-origin'" nomad360_bug_report.js; then
            echo "Formspree domain restriction needs the site origin (no path/query)" >&2; exit 1
          fi
      - name: One-time real Formspree transport acceptance (owner approved)
        run: |
          # One live test message, on this designated commit only. Never on subsequent PR updates.
          if [ "$(git log -1 --format=%s)" != "test(task09): live Formspree delivery smoke" ]; then
            echo "Not the explicitly designated one-time live transport commit"; exit 0
          fi
          node - <<'NODE'
          (async()=>{
            const body=new FormData();
            const trace='TASK09-LIVE-SMOKE-'+Date.now();
            body.append('message','Nomad360 Task 09 single live delivery verification. This is a test, not a visitor report. '+trace);
            body.append('interface_language','ru');
            body.append('viewport_width','390');
            body.append('_subject','Nomad360 lite bug report - TASK09 live acceptance');
            const response=await fetch('https://formspree.io/f/mwlvadod',{
              method:'POST',body,headers:{Accept:'application/json'},
              redirect:'manual',signal:AbortSignal.timeout(15000)
            });
            const raw=await response.text();
            let receipt;
            try{receipt=JSON.parse(raw)}catch{receipt=null}
            console.log('FORM_SPREE_LIVE_ACCEPTANCE',JSON.stringify({
              trace,http:response.status,ok:response.ok,providerOk:receipt?.ok===true,
              errors:receipt?.errors||null
            }));
            if(!response.ok||receipt?.ok!==true)process.exitCode=1;
          })().catch(err=>{console.error('FORM_SPREE_LIVE_FAILURE',err.message);process.exitCode=1});
          NODE
      - name: Financial regressions and original frozen VAT
        run: |
          node tests/sales_tax_7b_baseline.cjs
          node --test tests/sales_tax_7b_pure.test.cjs tests/sales_tax_7b_v2_projection.test.cjs tests/sales_tax_7b5_price_export.test.cjs
  bug-report-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned Chromium
        run: |
          npm install --prefix "$RUNNER_TEMP/bug09-tools" --no-save --no-package-lock playwright@1.58.0
          "$RUNNER_TEMP/bug09-tools/node_modules/.bin/playwright" install --with-deps chromium
      - name: RU/EN/KK, mobile/desktop, keyboard, privacy and mocked handler
        env:
          NODE_PATH: ${{ runner.temp }}/bug09-tools/node_modules
        run: node tests/nomad360_bug_report_browser.cjs
      - name: Screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bug-report-09-chromium-screenshots
          path: artifacts/bug-report/*.png
          retention-days: 14
