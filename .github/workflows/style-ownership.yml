name: C5-5 page stylesheet ownership and isolation
on:
  pull_request:
    paths:
      - 'assets/nomad360-*.css'
      - 'en/**'
      - 'ru/help/**'
      - 'kk/help/**'
      - 'license/**'
      - 'scripts/style-ownership/**'
      - 'tests/style_ownership.test.cjs'
      - 'tests/fixtures/style-ownership/**'
      - 'docs/architecture/nomad360-style-owners.json'
      - 'docs/reviews/style-ownership-05-5/**'
      - '.github/workflows/style-ownership.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  page-ownership:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NODE_PATH: ${{ github.workspace }}/scripts/palette/node_modules
      C55_BASELINE_ROOT: ${{ github.workspace }}/.c55-baseline
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate narrowly scoped SEO-only changes against current main
        run: |
          node scripts/seo/r3_ci_scope.cjs
          node scripts/seo/help_ci_scope.cjs
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Locked tools and accepted main
        run: |
          npm ci --prefix scripts/palette --ignore-scripts --no-audit --no-fund
          npm ci --prefix scripts/localization --ignore-scripts --no-audit --no-fund
          scripts/palette/node_modules/.bin/playwright install --with-deps chromium
          git worktree add --detach "$C55_BASELINE_ROOT" 930fc1bad7d34d9921bd543830e36caec2e2ef87
      - name: Exact component boundary, negative guards and financial contracts
        run: |
          node --check scripts/style-ownership/browser.cjs
          node --test tests/style_ownership.test.cjs tests/cleanup_about_copy.test.cjs tests/cleanup_scene_layout.test.cjs tests/cleanup_scene.test.cjs tests/cleanup_canvas.test.cjs tests/cleanup_palette.test.cjs tests/cleanup_about.test.cjs tests/cleanup_logo_mask.test.cjs tests/partner_build_scope.test.cjs tests/banner_vector_quality.test.cjs tests/task10_palette_source.test.cjs tests/nomad360_marketing_scope.test.cjs tests/nomad360_v1_engine.test.cjs tests/nomad360_v1_engine_scope.test.cjs tests/nomad360_draft_store.test.cjs tests/tax_draft_storage_scope.test.cjs tests/portfolio_v2_engine.test.cjs tests/portfolio_v2_linked.test.cjs tests/nomad360_price_export.test.cjs
          node scripts/palette/build.cjs --check
          node scripts/localization/inventory.cjs --check
          node tests/sales_tax_7b_baseline.cjs
          node tests/helpers/pinned-controls-css-scope.cjs
          python scripts/seo/check_phase_a.py
          node scripts/style-ownership/model.cjs artifacts/style-ownership/ownership.json
      - name: Pinned site utilities
        run: |
          mkdir -p artifacts/style-ownership
          printf '@tailwind base;\n@tailwind components;\n@tailwind utilities;\n' > "$RUNNER_TEMP/c55.css"
          scripts/palette/node_modules/.bin/tailwindcss -i "$RUNNER_TEMP/c55.css" -o artifacts/style-ownership/utilities.css --content './Marketing_calc.HTML,./portfolio_v2_*ui.js,./nomad360_*.js' --minify
      - name: Historical C5 browser comparisons for stylesheet changes
        if: env.SEO_R3_SCOPE != 'true' && env.HELP_SEO_SCOPE != 'true'
        run: node scripts/style-ownership/browser.cjs artifacts/style-ownership
      - name: SEO R3 real-browser pages, keyboard, navigation, model and offline regression
        if: env.SEO_R3_SCOPE == 'true' || env.HELP_SEO_SCOPE == 'true'
        run: |
          node scripts/seo/test_locales.cjs
          node scripts/seo/test_browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: style-ownership-canvas-${{ github.sha }}
          path: |
            artifacts/style-ownership/*.json
            artifacts/style-ownership/*.png
          retention-days: 14
  business-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NODE_PATH: ${{ github.workspace }}/scripts/palette/node_modules
      C4_BASELINE_ROOT: ${{ github.workspace }}/.c4-baseline
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate narrowly scoped SEO-only changes against current main
        run: |
          node scripts/seo/r3_ci_scope.cjs
          node scripts/seo/help_ci_scope.cjs
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Lock-pinned tools and accepted baseline
        run: |
          npm ci --prefix scripts/palette --ignore-scripts --no-audit --no-fund
          npm ci --prefix scripts/localization --ignore-scripts --no-audit --no-fund
          scripts/palette/node_modules/.bin/playwright install --with-deps chromium
          git worktree add --detach "$C4_BASELINE_ROOT" 27e38c752d89938fdfd1d1da4579164a8b43963c
      - name: Independent seven-rule receipt, negative cascade/source guards and financial contracts
        run: |
          node --check scripts/cleanup-palette/compare.cjs
          node --test tests/cleanup_palette.test.cjs tests/cleanup_about.test.cjs tests/cleanup_logo_mask.test.cjs tests/partner_build_scope.test.cjs tests/banner_vector_quality.test.cjs tests/task10_palette_source.test.cjs tests/nomad360_marketing_scope.test.cjs tests/nomad360_v1_engine.test.cjs tests/nomad360_v1_engine_scope.test.cjs tests/nomad360_draft_store.test.cjs tests/tax_draft_storage_scope.test.cjs tests/portfolio_v2_engine.test.cjs tests/portfolio_v2_linked.test.cjs tests/nomad360_price_export.test.cjs
          node tests/helpers/pinned-controls-css-scope.cjs
          node scripts/palette/build.cjs --check
          node scripts/localization/inventory.cjs --check
          node tests/sales_tax_7b_baseline.cjs
          python scripts/seo/check_phase_a.py
      - name: Compile pinned utility CSS
        run: |
          mkdir -p artifacts/cleanup-c4 artifacts/task10-palette
          printf '@tailwind base;\n@tailwind components;\n@tailwind utilities;\n' > "$RUNNER_TEMP/c4.css"
          scripts/palette/node_modules/.bin/tailwindcss -i "$RUNNER_TEMP/c4.css" -o artifacts/cleanup-c4/utilities.css --content './Marketing_calc.HTML,./portfolio_v2_*ui.js,./nomad360_*.js' --minify
          cp artifacts/cleanup-c4/utilities.css artifacts/task10-palette/utilities.css
      - name: Historical C4 paired CSS and business comparison
        if: env.SEO_R3_SCOPE != 'true' && env.HELP_SEO_SCOPE != 'true'
        run: |
          node scripts/cleanup-palette/compare.cjs artifacts/cleanup-c4
          node scripts/cleanup-palette/repeated.cjs artifacts/cleanup-c4
      - name: SEO R3 contemporary financial browser and original source integrity
        if: env.SEO_R3_SCOPE == 'true' || env.HELP_SEO_SCOPE == 'true'
        run: |
          node scripts/seo/test_locales.cjs
          node scripts/seo/test_browser.cjs
          node tests/sales_tax_7b_baseline.cjs
      - name: Actual Excel downloads, independent OOXML and PDF projection
        run: |
          set -o pipefail
          cp artifacts/cleanup-c4/utilities.css artifacts/excel-utilities.css
          node tests/nomad360_price_export_browser.test.cjs | tee artifacts/cleanup-c4/excel.log
          python -m pip install openpyxl==3.1.5
          python tests/nomad360_price_export_openxml.py | tee artifacts/cleanup-c4/ooxml.log
          node tests/sales_tax_7b5_v1_pdf_browser.cjs | tee artifacts/cleanup-c4/pdf.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: c55-business-${{ github.sha }}
          path: |
            artifacts/cleanup-c4/*.json
            artifacts/cleanup-c4/*.png
            artifacts/cleanup-c4/*.log
            artifacts/excel/*.json
            artifacts/excel/*.xlsx
          retention-days: 14
