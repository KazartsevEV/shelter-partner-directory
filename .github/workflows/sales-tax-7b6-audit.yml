name: SALES-TAX-07B-6 final end-to-end audit
on:
  pull_request:
    paths:
      - '.github/workflows/sales-tax-7b6-audit.yml'
      - 'tests/sales_tax_7b6_*'
      - 'docs/reviews/sales-tax-7b/STAGE_7B6_ACCEPTANCE.md'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  frozen-vat-and-finance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Refuse modifications outside the three audit artifacts
        run: |
          git fetch --no-tags origin main
          changed="$(git diff --name-only origin/main...HEAD)"
          echo "$changed"
          unexpected="$(printf '%s\n' "$changed" | grep -Ev '^(\.github/workflows/sales-tax-7b6-audit\.yml|tests/sales_tax_7b6_final_audit\.test\.cjs|docs/reviews/sales-tax-7b/STAGE_7B6_ACCEPTANCE\.md)$' || true)"
          if test -n "$unexpected"; then
            echo "Out-of-scope change: $unexpected" >&2
            exit 1
          fi
      - name: Prepare pinned localization dependencies
        run: npm ci --prefix scripts/localization --ignore-scripts --no-audit --no-fund
      - name: SHA-256 evidence, all 48 frozen VAT cases and independent 384-price oracle
        run: |
          node --check tests/sales_tax_7b6_final_audit.test.cjs
          node --test tests/sales_tax_7b6_final_audit.test.cjs
          node tests/sales_tax_7b_baseline.cjs
      - name: Finance, principal/agent, credit, tax, discount, legacy Excel and PR 155 copy
        run: |
          node --test tests/sales_tax_7b_pure.test.cjs tests/sales_tax_7b_v2_projection.test.cjs tests/sales_tax_7b5_price_export.test.cjs tests/v1_service_v2_numeric_parity.test.cjs tests/portfolio_v2_engine.test.cjs tests/portfolio_v2_linked.test.cjs tests/portfolio_v2_period_price.test.cjs tests/portfolio_v2_temporal_cash.test.cjs tests/nomad360_price_export.test.cjs tests/nomad360_marketing_scope.test.cjs
  historical-vat-78-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned Chromium, build identical Tailwind CSS
        run: |
          npm install --prefix "$RUNNER_TEMP/sales-tax-7b6-tools" --no-save --no-package-lock playwright@1.58.0 tailwindcss@3.4.17
          "$RUNNER_TEMP/sales-tax-7b6-tools/node_modules/.bin/playwright" install --with-deps chromium
          mkdir -p artifacts/sales-tax-7b
          printf '@tailwind base;\n@tailwind components;\n@tailwind utilities;\n' > "$RUNNER_TEMP/sales-tax-7b6-utilities.css"
          "$RUNNER_TEMP/sales-tax-7b6-tools/node_modules/.bin/tailwindcss" -i "$RUNNER_TEMP/sales-tax-7b6-utilities.css" --content './Marketing_calc.HTML,./nomad360_*.js,./portfolio_v2_*ui.js' -o artifacts/sales-tax-7b/utilities.css --minify
      - name: Verify 78 Chromium VAT routes, restores, transfers, 6 original Excel and 6 PDF
        run: |
          NODE_PATH="$RUNNER_TEMP/sales-tax-7b6-tools/node_modules" node tests/sales_tax_7b_vat_browser.cjs
          node -e "const p=require('./artifacts/sales-tax-7b/vat-after/protocol.json');if(p.cases.length!==78||p.cases.filter(x=>x.excel).length!==6)process.exit(1);console.log('7B6_HISTORICAL_VAT_BROWSER_GREEN '+p.cases.length)"
      - name: Upload VAT comparison evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sales-tax-7b6-historical-vat
          path: artifacts/sales-tax-7b/
          retention-days: 14
  sales-tax-browser-exports:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned Chromium
        run: |
          npm install --no-save --package-lock=false playwright@1.58.0 tailwindcss@3.4.17
          npx playwright install --with-deps chromium
      - name: V1 goods, online/offline, agent/principal, self/hired, payer, VAT and credit
        run: |
          node tests/sales_tax_7b_goods_browser.cjs
          node tests/sales_tax_7b_services_browser.cjs
      - name: V2 standalone/linked, bundle, cross-sell, upsell and agent
        run: node tests/sales_tax_7b_v2_browser.cjs
      - name: V1 and V2 RU/EN/KK, PDF, Excel, reload, legacy saves and offline HTML
        run: |
          node tests/sales_tax_7b5_v1_pdf_browser.cjs
          node tests/sales_tax_7b5_v2_export_browser.cjs
      - name: PR 156 legacy example and reset paths
        run: node tests/simple_service_examples_browser.cjs
      - name: Upload additional export evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sales-tax-7b6-export-samples
          path: artifacts/sales-tax-7b5/
          retention-days: 14
