name: SEO-07 English and language handoff acceptance

on:
  pull_request:
    paths:
      - 'docs/seo/**'
      - 'scripts/seo/**'
      - 'docs/reviews/seo-07-phase-a-review.md'
      - 'docs/reviews/seo-07-phase-b-review.md'
      - 'docs/nomad360-codex-task-map.md'
      - 'en/**'
      - 'assets/nomad360-seo.css'
      - 'nomad360_header.js'
      - 'nomad360_locale_core.js'
      - 'nomad360_calculator_ui.css'
      - 'tests/fixtures/seo-*.html'
      - 'docs/reviews/seo-banner-review.md'
      - 'Marketing_calc.HTML'
      - 'nomad360_seo_language.js'
      - 'tests/seo_language.test.cjs'
      - 'tests/helpers/seo-html-contract.cjs'
      - '.github/workflows/seo-07-phase-a.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  review-package:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify preserved application and recorded observations
        env:
          SEO_BASE_REF: ${{ github.event.pull_request.base.sha || 'origin/main' }}
        run: |
          python scripts/seo/check_phase_a.py
          node --check scripts/seo/audit_browser.cjs
          node --check scripts/seo/check_mockups.cjs
          node --check nomad360_seo_language.js
          node --test tests/seo_language.test.cjs
          python scripts/seo/build.py --check
          python -c "import ast,pathlib; [ast.parse(p.read_text()) for p in pathlib.Path('scripts/seo').glob('*.py')]"
      - name: Install pinned review browser
        run: |
          npm install --prefix "$RUNNER_TEMP/seo-review-tools" --no-save --no-package-lock playwright@1.58.0 tailwindcss@3.4.17
          "$RUNNER_TEMP/seo-review-tools/node_modules/.bin/playwright" install --with-deps chromium
      - name: Check both mockups without page JavaScript
        env:
          NODE_PATH: ${{ runner.temp }}/seo-review-tools/node_modules
        run: node scripts/seo/check_mockups.cjs
      - name: English source pages, shared logo, language priority and restored calculations
        env:
          NODE_PATH: ${{ runner.temp }}/seo-review-tools/node_modules
        run: node scripts/seo/test_browser.cjs
      - name: Compile local calculator utilities
        run: |
          mkdir -p artifacts
          printf '@tailwind base;\n@tailwind components;\n@tailwind utilities;\n' > "$RUNNER_TEMP/seo-utilities.css"
          "$RUNNER_TEMP/seo-review-tools/node_modules/.bin/tailwindcss" -i "$RUNNER_TEMP/seo-utilities.css" --content './Marketing_calc.HTML,./nomad360_*.js,./portfolio_v2_*ui.js' -o artifacts/seo-banner-utilities.css --minify
      - name: Original offer and calculator SEO banner RU EN KK
        env:
          NODE_PATH: ${{ runner.temp }}/seo-review-tools/node_modules
        run: node scripts/seo/test_banner.cjs
      - name: Upload phase A review receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seo-07-english-acceptance
          path: |
            docs/seo/
            artifacts/seo-phase-b/
            artifacts/seo-banner/
