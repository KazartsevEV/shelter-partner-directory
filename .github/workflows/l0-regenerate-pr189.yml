name: TEMP regenerate L0 for PR189
on:
  pull_request:
    paths:
      - '.github/workflows/l0-regenerate-pr189.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  regenerate:
    if: github.event_name == 'pull_request' && github.event.pull_request.number == 189 && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --prefix scripts/localization --ignore-scripts --no-audit --no-fund
      - run: |
          node scripts/localization/inventory.cjs
          node scripts/localization/inventory.cjs --check
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/localization/l0/
          if ! git diff --cached --quiet; then
            git commit -m 'chore(l10n): refresh L0 catalog after responsive study-link layout'
            git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
          fi
