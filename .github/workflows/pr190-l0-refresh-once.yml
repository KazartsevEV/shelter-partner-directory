name: PR190 one-shot L0 source manifest regeneration
on:
  push:
    branches:
      - fix/v2-canonical-output-tax-excel-20261018
    paths:
      - .github/workflows/pr190-l0-refresh-once.yml

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build and validate only L0 source inventory
        run: |
          npm ci --prefix scripts/localization --ignore-scripts --no-audit --no-fund
          node scripts/localization/inventory.cjs
          node scripts/localization/inventory.cjs --check
      - name: Commit regenerated inventory only to PR190 branch
        run: |
          test "$GITHUB_REF_NAME" = "fix/v2-canonical-output-tax-excel-20261018"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A docs/localization/l0
          if git diff --cached --quiet; then
            echo "L0 was already current"
            exit 0
          fi
          git commit -m "chore(l0): regenerate exact translated source inventory for PR190"
          git push origin "HEAD:refs/heads/fix/v2-canonical-output-tax-excel-20261018"
