name: Diagnostic — V1 draft recovery via file scheme

on:
  pull_request:
    paths:
      - "tests/v1_file_recovery_diagnostic.test.cjs"
      - ".github/workflows/v1-file-recovery-diagnostic.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  file-v1-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Playwright
        run: npm install --no-save --no-package-lock playwright@1.58.0
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Exercise original V1 file recovery flows (no retries)
        run: |
          node tests/portfolio_v2_full_service_browser.test.cjs
          node tests/marketing_calc_first_user_journey.test.cjs
      - name: Record raw storage before and after 50 file reloads
        run: node tests/v1_file_recovery_diagnostic.test.cjs
