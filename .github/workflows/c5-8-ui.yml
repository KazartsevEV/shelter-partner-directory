name: C5-8 scoped UI cascade consolidation
on:
  pull_request:
    paths:
      - "nomad360_calculator_ui.css"
      - "tests/c5_8_ui_scope.test.cjs"
      - "tests/c5_8_ui_browser.cjs"
      - ".github/workflows/c5-8-ui.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ui-cascade:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install parser and locked Chromium
        run: |
          npm ci --prefix scripts/palette --ignore-scripts --no-audit --no-fund
          scripts/palette/node_modules/.bin/playwright install --with-deps chromium
      - name: Check exact approved source diff and all CSS cascade owners
        run: node --test tests/c5_8_ui_scope.test.cjs
      - name: Paired browser UI 2 pages x 5 widths x 3 locales
        run: node tests/c5_8_ui_browser.cjs
      - name: Frozen financial and tax checks
        run: |
          node --test tests/nomad360_v1_engine.test.cjs tests/portfolio_v2_engine.test.cjs tests/nomad360_draft_store.test.cjs
          node tests/sales_tax_7b_baseline.cjs
