name: C6 V1 form operations and unchanged financial contracts
on:
  pull_request:
    paths:
      - 'Marketing_calc.HTML'
      - 'US_Retail_Demo.HTML'
      - 'nomad360_v1_operations.js'
      - 'scripts/cleanup-v1/**'
      - 'tests/nomad360_v1_operations.test.cjs'
      - 'tests/helpers/v1-operations-scope.cjs'
      - 'tests/fixtures/v1-operations/**'
      - 'docs/reviews/v1-operations-06/**'
      - '.github/workflows/v1-operations.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  v1-operations:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      NODE_PATH: ${{ github.workspace }}/scripts/palette/node_modules
      C6_BASELINE_ROOT: ${{ github.workspace }}/.c6-baseline
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Locked parsers, browser and accepted main
        run: |
          npm ci --prefix scripts/localization --ignore-scripts --no-audit --no-fund
          npm ci --prefix scripts/palette --ignore-scripts --no-audit --no-fund
          scripts/palette/node_modules/.bin/playwright install --with-deps chromium
          git worktree add --detach "$C6_BASELINE_ROOT" 9851eff63a2c50d074ea7e1420f8ecc48812d0fc
      - name: Exact extraction, immutable input, pending states and independent financial oracles
        run: |
          node --check nomad360_v1_operations.js
          node --check scripts/cleanup-v1/compare.cjs
          node --test tests/nomad360_v1_operations.test.cjs tests/nomad360_v1_engine.test.cjs tests/nomad360_v1_engine_scope.test.cjs tests/nomad360_draft_store.test.cjs tests/tax_draft_storage_scope.test.cjs tests/partner_application_scope.test.cjs tests/partner_build_scope.test.cjs tests/nomad360_payments.test.cjs tests/currency_converter.test.cjs tests/portfolio_v2_engine.test.cjs tests/portfolio_v2_linked.test.cjs tests/portfolio_v2_v1_parity.test.cjs tests/v1_service_v2_numeric_parity.test.cjs tests/shopper_v1_oracle.test.cjs tests/nomad360_price_export.test.cjs
          node tests/sales_tax_7b_baseline.cjs
          node scripts/localization/inventory.cjs --check
          python scripts/seo/check_phase_a.py
      - name: Same pinned CSS for before and after
        run: |
          mkdir -p artifacts/v1-operations artifacts/v1-engine
          printf '@tailwind base;\n@tailwind components;\n@tailwind utilities;\n' > "$RUNNER_TEMP/c6.css"
          scripts/palette/node_modules/.bin/tailwindcss -i "$RUNNER_TEMP/c6.css" -o artifacts/v1-operations/utilities.css --content './Marketing_calc.HTML,./portfolio_v2_*ui.js,./nomad360_*.js' --minify
          cp artifacts/v1-operations/utilities.css artifacts/v1-engine/utilities.css
          cp artifacts/v1-operations/utilities.css artifacts/excel-utilities.css
      - name: Real form callbacks, both entrypoints, fresh portable HTML and paired performance
        run: node scripts/cleanup-v1/compare.cjs artifacts/v1-operations
      - name: Original first-user save and restore, full-service restore and PDF
        run: |
          node tests/marketing_calc_first_user_journey.test.cjs
          node tests/portfolio_v2_full_service_browser.test.cjs
          node tests/sales_tax_7b5_v1_pdf_browser.cjs
      - name: Real local Excel downloads in both V2 modes
        run: node tests/nomad360_price_export_browser.test.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v1-operations-${{ github.sha }}
          path: |
            artifacts/v1-operations/*.json
            artifacts/v1-operations/*.png
            artifacts/excel/*.json
            artifacts/excel/*.xlsx
          retention-days: 14
