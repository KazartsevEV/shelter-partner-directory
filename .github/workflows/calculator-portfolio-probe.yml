name: Calculator 2-SKU audit

on:
  pull_request:
    paths:
      - "Marketing_calc.HTML"
      - "tests/marketing_calc_second_sku_probe.cjs"
      - ".github/workflows/calculator-portfolio-probe.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portfolio:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-save --no-package-lock playwright@1.58.0
      - run: npx playwright install --with-deps chromium
      - run: node tests/marketing_calc_second_sku_probe.cjs
