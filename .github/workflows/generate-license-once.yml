name: Generate legal pages and synchronize localization once
on:
  push:
    branches: [fix/nomad360-public-license]
    paths: ['.github/workflows/generate-license-once.yml']
permissions:
  contents: write
jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate legal pages
        run: |
          python3 scripts/legal/build_license.py
          python3 scripts/legal/build_license.py --check
      - name: Install localization build prerequisites
        run: npm ci --prefix scripts/localization --ignore-scripts --no-audit --no-fund
      - name: Regenerate localization inventory and self-remove this workflow
        run: |
          node scripts/localization/inventory.cjs
          rm .github/workflows/generate-license-once.yml
          git add -A license docs/localization/l0 .github/workflows/generate-license-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --cached --quiet; then
            git commit -m "chore(license): generate public 2.3 legal pages and refresh localization inventory"
            git push origin HEAD:fix/nomad360-public-license
          fi
