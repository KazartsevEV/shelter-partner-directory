name: R1 partner content QA
on:
  pull_request:
    paths:
      - 'scripts/partners/r1-content/**'
      - 'docs/partners/partner-release-copy.md'
      - 'docs/reviews/r1-qa-guard-fix/**'
      - '.github/workflows/r1-content-qa.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/partners/r1-content/**'
      - 'docs/partners/partner-release-copy.md'
      - '.github/workflows/r1-content-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  content-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax and accepted catalog
        run: |
          node --check scripts/partners/r1-content/verify.cjs
          node --check scripts/partners/r1-content/verify.test.cjs
          node scripts/partners/r1-content/verify.cjs
      - name: Adversarial catalog and transition regression tests
        run: node scripts/partners/r1-content/verify.test.cjs
