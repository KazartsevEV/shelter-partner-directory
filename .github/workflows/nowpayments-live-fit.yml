name: Temporary NOWPayments live height probe
on:
  push:
    branches: [fix/nowpayments-tight-widget-20261011]
    paths: [tests/nowpayments_live_fit.cjs, .github/workflows/nowpayments-live-fit.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-save --no-package-lock playwright@1.58.0
      - run: npx playwright install --with-deps chromium
      - run: node tests/nowpayments_live_fit.cjs
