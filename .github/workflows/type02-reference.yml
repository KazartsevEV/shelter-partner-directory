name: TYPE-02 B Inter typography acceptance
on:
  pull_request:
    paths:
      - 'nomad360_design_system.css'
      - 'nomad360_calculator_ui.css'
      - 'Marketing_calc.HTML'
      - 'portfolio_v2_linked_ui.js'
      - 'tests/type02_*'
      - 'vendor/fonts/type02/**'
      - 'docs/reviews/type02*'
      - 'docs/reviews/type02-reference/**'
      - '.github/workflows/type02-reference.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reference:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify protected application sources and font provenance
        run: |
          node --check tests/type02_acceptance_browser.cjs
          node --check tests/type02_exports_browser.cjs
          node --test tests/type02_scope.test.cjs
      - name: Financial engine regression
        run: node --test tests/portfolio_v2_engine.test.cjs tests/marketing_calc_regressions.test.cjs tests/marketing_calc_full_cycle.test.cjs tests/marketing_calc_resale.test.cjs tests/marketing_calc_dropship.test.cjs tests/portfolio_v2_linked.test.cjs tests/portfolio_v2_temporal.test.cjs tests/portfolio_v2_temporal_cash.test.cjs tests/portfolio_v2_pooled_media.test.cjs tests/portfolio_v2_period_pnl.test.cjs tests/portfolio_v2_period_price.test.cjs tests/portfolio_v2_f3_mixed_oracle.test.cjs tests/portfolio_v2_f4_release.test.cjs tests/marketing_calc_offline_service.test.cjs tests/portfolio_v2_offline_service.test.cjs tests/calculator_business_oracle_v2.test.cjs tests/portfolio_v2_v1_parity.test.cjs tests/portfolio_v2_online_adapter.test.cjs tests/nomad360_agent_roles_ui.test.cjs tests/nomad360_repo_traffic.test.cjs tests/portfolio_v2_mba_observed.test.cjs tests/portfolio_v2_mba_capacity.test.cjs tests/nomad360_locale_diagnostics.test.cjs tests/portfolio_v2_full_service.test.cjs tests/portfolio_v2_full_service_linked.test.cjs
      - run: npm install --no-save --package-lock=false playwright@1.58.0 tailwindcss@3.4.17
      - name: Parse both presentation stylesheets
        run: node -e "const fs=require('fs'),p=require('postcss');for(const f of ['nomad360_design_system.css','nomad360_calculator_ui.css','docs/reviews/type02-reference/fonts.css'])p.parse(fs.readFileSync(f,'utf8'));console.log('CSS_SYNTAX_GREEN')"
      - run: npx playwright install --with-deps chromium
      - name: Exact accepted base and deterministic Tailwind utilities
        run: |
          mkdir -p /tmp/type02-baseline artifacts/type02
          # Compare this module extraction with the accepted main after PR #218.
          git archive b9802d01add3a62ca0874415c21750c5a902102f | tar -x -C /tmp/type02-baseline
          printf '@tailwind base;\n@tailwind components;\n@tailwind utilities;\n' > /tmp/type02-utilities.css
          npx tailwindcss -i /tmp/type02-utilities.css -o artifacts/type02/utilities.css --content './Marketing_calc.HTML,./portfolio_v2_*ui.js,./nomad360_*.js'
      - name: V1/V2 before-after, real Inter glyphs, finance, restore and fallback
        run: node tests/type02_acceptance_browser.cjs
        env:
          TYPE02_BASELINE_ROOT: /tmp/type02-baseline
          TYPE02_CURRENT_BASE: '1'
      - name: Portable HTML and owned print report
        run: node tests/type02_exports_browser.cjs
        env:
          TYPE02_BASELINE_ROOT: /tmp/type02-baseline
      - name: All localized business routes, including full services and agent
        run: |
          cp artifacts/type02/utilities.css artifacts/l0-utilities.css
          node tests/nomad360_localization_l0_browser.cjs
        env:
          NOMAD360_LOCALE_ACCEPTANCE: '1'
          TYPE02_ROLE_AUDIT: '1'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: type02-b-protocols
          path: artifacts/type02-b/*.json
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: type02-b-ru-originals
          path: artifacts/type02-b/ru-*
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: type02-b-en-originals
          path: artifacts/type02-b/en-*
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: type02-b-kk-originals
          path: artifacts/type02-b/kk-*
          retention-days: 14
