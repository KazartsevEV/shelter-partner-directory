name: TEMP V2 final offline package sync PR190
on:
  pull_request:
    paths:
      - '.github/workflows/v2-output-refresh-artifacts.yml'
permissions:
  contents: write
jobs:
  regenerate:
    if: github.event.pull_request.number == 190 && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Regenerate exact localization inventory
        run: |
          npm ci --prefix scripts/localization --ignore-scripts --no-audit --no-fund
          node scripts/localization/inventory.cjs
          node scripts/localization/inventory.cjs --check
      - name: Syntax and unchanged finance plus Excel source guard
        run: |
          node --check portfolio_v2_ui.js
          node --check portfolio_v2_us_demo_ui.js
          node --check nomad360_price_export.js
          node --check scripts/demos/build_us_retail_truth_xlsx.cjs
          node --test tests/nomad360_locale_semantic.test.cjs tests/nomad360_marketing_scope.test.cjs tests/return_7a_scope.test.cjs tests/type02_scope.test.cjs tests/sales_tax_7b5_price_export.test.cjs tests/nomad360_price_export.test.cjs
      - name: Build and read-back canonical numeric Sales Tax XLSX
        run: node scripts/demos/build_us_retail_truth_xlsx.cjs
      - name: Install pinned Chromium and Tailwind
        run: |
          npm install --prefix "$RUNNER_TEMP/us-truth" --no-save --no-package-lock playwright@1.58.0 tailwindcss@3.4.17
          "$RUNNER_TEMP/us-truth/node_modules/.bin/playwright" install --with-deps chromium
          printf '@tailwind base;\n@tailwind components;\n@tailwind utilities;\n' > "$RUNNER_TEMP/v2-truth-input.css"
          "$RUNNER_TEMP/us-truth/node_modules/.bin/tailwindcss" -i "$RUNNER_TEMP/v2-truth-input.css" -o "$RUNNER_TEMP/v2-truth-output.css" --content "./US_Retail_Demo.HTML,./*.js" --minify
      - name: Rebuild original V2 embedded outputs and actual screenshots
        env:
          NOMAD360_TAILWIND_CSS: ${{ runner.temp }}/v2-truth-output.css
          NODE_PATH: ${{ runner.temp }}/us-truth/node_modules
        run: |
          node scripts/demos/build_us_retail_standalone.cjs
          node tests/us_retail_demo_full_html_browser.cjs
          cp artifacts/us-retail-demo/US_Retail_Demo_FILLED.html US_Retail_Demo_FILLED.html
          cp artifacts/us-retail-demo/US_Retail_Demo_EN_FILLED.html US_Retail_Demo_EN_FILLED.html
          cp artifacts/us-retail-demo/US_Retail_12M_Tax_RU.xlsx docs/reviews/v2-output-truth-01/US_Retail_12M_Tax_RU.xlsx
          mkdir -p docs/reviews/v2-output-truth-01/screenshots
          cp artifacts/us-retail-demo/US-Retail-V2-390px.png docs/reviews/v2-output-truth-01/screenshots/US-Retail-V2-390px.png
          cp artifacts/us-retail-demo/US-Retail-V2-1280px.png docs/reviews/v2-output-truth-01/screenshots/US-Retail-V2-1280px.png
          cp artifacts/us-retail-demo/US-Retail-V2-EN-390px.png docs/reviews/v2-output-truth-01/screenshots/US-Retail-V2-EN-390px.png
      - name: Commit only the generated artifacts back to PR head
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/localization/l0/ docs/reviews/v2-output-truth-01/screenshots/ docs/reviews/v2-output-truth-01/US_Retail_12M_Tax_RU.xlsx US_Retail_Demo_FILLED.html US_Retail_Demo_EN_FILLED.html
          if ! git diff --cached --quiet; then
            git commit -m 'chore(v2 artifacts): regenerate L0, canonical Excel, offline HTML and real UI captures'
            git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
          fi
      - name: Attach study artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: V2-OUTPUT-TRUTH-01
          path: artifacts/us-retail-demo/
          retention-days: 14
