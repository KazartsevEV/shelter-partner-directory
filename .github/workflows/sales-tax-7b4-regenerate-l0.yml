name: SALES-TAX-07B4 one-time L0 regeneration
on:
  push:
    branches: [feature/sales-tax-7b-4-v2]
    paths: [nomad360_locale_core.js]
permissions:
  contents: write
jobs:
  regenerate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/sales-tax-7b-4-v2
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate canonical L0 inventory (not a bypass)
        run: |
          npm ci --ignore-scripts
          node scripts/localization/inventory.cjs
          node scripts/localization/inventory.cjs --check
      - name: Commit only generated inventory files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/localization/l0/
          if ! git diff --cached --quiet; then
            git commit -m "chore(7B4): regenerate L0 inventory from updated sources"
            git push origin HEAD:feature/sales-tax-7b-4-v2
          fi
