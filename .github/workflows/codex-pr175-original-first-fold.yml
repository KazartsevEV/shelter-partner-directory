name: Audit original Codex PR175 first banner viewport fold
on:
  push:
    branches:
      - 'audit/codex-pr175-first-hero-fold-20261017'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-first-fold:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prove Codex PR175 design source is byte-for-byte untouched
        run: |
          git diff --exit-code bb0c43f216a0196cbf2173e6c2c206314c5e92d1 HEAD -- Marketing_calc.HTML nomad360_calculator_ui.css nomad360_banners.js assets/nomad360-banners/hero.webp nomad360_header.js
          node --check tests/codex_pr175_original_first_fold.cjs
      - name: Install Chromium
        run: |
          npm install --prefix "$RUNNER_TEMP/codex-original" --no-save --no-package-lock playwright@1.58.0
          "$RUNNER_TEMP/codex-original/node_modules/.bin/playwright" install --with-deps chromium
      - name: Only original first banner at 20 viewport pairs x RU EN KK
        env:
          NODE_PATH: ${{ runner.temp }}/codex-original/node_modules
        run: node tests/codex_pr175_original_first_fold.cjs
      - name: Save fold report and real original screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: codex-pr175-original-first-fold
          path: artifacts/codex-pr175-original-first-fold/
          retention-days: 14
