name: Nomad360 navigation Chromium smoke

on:
  pull_request:
    paths:
      - "Marketing_calc.HTML"
      - "nomad360_navigation.js"
      - "nomad360_design_system.css"
      - "tests/nomad360_global_tree_navigation_browser.test.cjs"
      - ".github/workflows/calculator-navigation-e2e.yml"
  push:
    branches: ["main"]
    paths:
      - "Marketing_calc.HTML"
      - "nomad360_navigation.js"
      - "nomad360_design_system.css"
      - "tests/nomad360_global_tree_navigation_browser.test.cjs"
      - ".github/workflows/calculator-navigation-e2e.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  navigation:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install browser test runner
        run: npm install --no-save --no-package-lock playwright@1.58.0
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Assert one functional inline back arrow in V1, V2 and services
        run: node tests/nomad360_global_tree_navigation_browser.test.cjs
