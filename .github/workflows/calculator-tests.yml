name: Marketing calculator regression checks

on:
  pull_request:
    paths:
      - "Marketing_calc.HTML"
      - "tests/marketing_calc_regressions.test.cjs"
      - "tests/marketing_calc_full_cycle.test.cjs"
      - "tests/marketing_calc_resale.test.cjs"
      - "tests/marketing_calc_dropship.test.cjs"
      - "tests/portfolio_v2_linked.test.cjs"
      - "tests/marketing_calc_offline_service.test.cjs"
      - "tests/portfolio_v2_offline_service.test.cjs"
      - "portfolio_v2_linked_engine.js"
      - "tests/portfolio_v2_mba_capacity.test.cjs"
      - "tests/portfolio_v2_online_adapter.test.cjs"
      - "portfolio_v2_online_adapter.js"
      - "tests/calculator_business_oracle_v2.test.cjs"
      - "tests/portfolio_v2_v1_parity.test.cjs"
      - "portfolio_v2_basket_ui.js"
      - "portfolio_v2_mba_observed.js"
      - "portfolio_v2_mba_observed_ui.js"
      - "tests/portfolio_v2_mba_observed.test.cjs"
      - ".github/workflows/calculator-tests.yml"
  push:
    branches: ["main"]
    paths:
      - "Marketing_calc.HTML"
      - "tests/marketing_calc_regressions.test.cjs"
      - "tests/marketing_calc_full_cycle.test.cjs"
      - ".github/workflows/calculator-tests.yml"
      - "tests/marketing_calc_resale.test.cjs"
      - "tests/marketing_calc_dropship.test.cjs"
      - "tests/portfolio_v2_linked.test.cjs"
      - "tests/marketing_calc_offline_service.test.cjs"
      - "tests/portfolio_v2_offline_service.test.cjs"
      - "portfolio_v2_linked_engine.js"
      - "tests/portfolio_v2_mba_capacity.test.cjs"
      - "tests/portfolio_v2_online_adapter.test.cjs"
      - "portfolio_v2_online_adapter.js"
      - "tests/calculator_business_oracle_v2.test.cjs"
      - "tests/portfolio_v2_v1_parity.test.cjs"
      - "portfolio_v2_basket_ui.js"
      - "portfolio_v2_mba_observed.js"
      - "portfolio_v2_mba_observed_ui.js"
      - "tests/portfolio_v2_mba_observed.test.cjs"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  calculator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify price, discount, VAT and SKU navigation contracts
        run: node --test tests/marketing_calc_regressions.test.cjs tests/marketing_calc_full_cycle.test.cjs tests/marketing_calc_resale.test.cjs tests/marketing_calc_dropship.test.cjs tests/portfolio_v2_linked.test.cjs tests/marketing_calc_offline_service.test.cjs tests/portfolio_v2_offline_service.test.cjs tests/calculator_business_oracle_v2.test.cjs tests/portfolio_v2_v1_parity.test.cjs tests/portfolio_v2_online_adapter.test.cjs tests/portfolio_v2_mba_observed.test.cjs tests/portfolio_v2_mba_capacity.test.cjs
