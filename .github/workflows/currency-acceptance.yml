name: Calculation currency acceptance
on:
  pull_request:
    paths:
      - 'Marketing_calc.HTML'
      - 'nomad360_currency.js'
      - 'nomad360_locale_core.js'
      - 'nomad360_header.js'
      - 'nomad360_calculator_ui.js'
      - 'portfolio_v2_*'
      - 'tests/nomad360_currency*.cjs'
      - '.github/workflows/currency-acceptance.yml'
jobs:
  currency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - run: node --test tests/nomad360_currency.test.cjs tests/nomad360_locale_diagnostics.test.cjs tests/calculator_business_oracle_v2.test.cjs tests/portfolio_v2_linked.test.cjs tests/portfolio_v2_v1_parity.test.cjs
      - run: node tests/nomad360_currency_browser.test.cjs
