name: Temporary B2B localization inventory refresh
on:
  pull_request:
    paths:
      - '.github/workflows/b2b-inventory-regeneration.yml'
permissions:
  contents: write
jobs:
  refresh:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate deterministic source census
        run: |
          npm ci --prefix scripts/localization --ignore-scripts --no-audit --no-fund
          node scripts/localization/inventory.cjs
          node scripts/localization/inventory.cjs --check
      - name: Commit regenerated inventory to feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/localization/l0
          if ! git diff --cached --quiet; then
            git commit -m "chore(i18n): regenerate L0 census for B2B banner"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi
