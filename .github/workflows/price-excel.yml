name: V2 local Excel price list acceptance
on:
  pull_request:
    paths:
      - 'Marketing_calc.HTML'
      - 'nomad360_price_export.js'
      - 'nomad360_calculator_ui.js'
      - 'portfolio_v2_ui.js'
      - 'vendor/**'
      - 'tests/nomad360_price_export*'
      - '.github/workflows/price-excel.yml'
jobs:
  excel:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock playwright@1.58.0 tailwindcss@3.4.17
      - run: npx playwright install --with-deps chromium
      - name: Syntax, XLSX content and financial parity
        run: |
          node --check nomad360_price_export.js
          node --check nomad360_calculator_ui.js
          node --check portfolio_v2_ui.js
          node --check tests/nomad360_price_export_browser.test.cjs
          node --test tests/nomad360_price_export.test.cjs tests/portfolio_v2_f4_release.test.cjs tests/portfolio_v2_v1_parity.test.cjs
      - name: Offline utility CSS
        run: |
          mkdir -p artifacts/excel
          printf '@tailwind base;\n@tailwind components;\n@tailwind utilities;\n' > /tmp/excel-utilities.css
          npx tailwindcss -i /tmp/excel-utilities.css -o artifacts/excel-utilities.css --content './Marketing_calc.HTML,./portfolio_v2_*ui.js,./nomad360_*.js'
      - name: Real XLSX downloads, source values, PDF, restore and RU EN KK
        run: node tests/nomad360_price_export_browser.test.cjs
      - name: Independent Open XML reader
        run: |
          python -m pip install openpyxl==3.1.5
          python tests/nomad360_price_export_openxml.py
      - name: LibreOffice Calc compatibility
        run: |
          sudo apt-get update
          sudo apt-get install -y libreoffice-calc
          mkdir -p artifacts/excel/calc
          libreoffice -env:UserInstallation=file:///tmp/nomad360-excel-calc --headless --convert-to xlsx --outdir artifacts/excel/calc artifacts/excel/320-ru-linked.xlsx artifacts/excel/320-en-standalone.xlsx artifacts/excel/320-kk-linked.xlsx
          python tests/nomad360_price_export_calc.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v2-excel-price-browser
          path: artifacts/excel
          retention-days: 14
