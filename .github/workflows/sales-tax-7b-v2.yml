name: SALES-TAX-07B stage 4 V2 isolated projection
on:
  pull_request:
    paths:
      - 'nomad360_sales_tax_v2.js'
      - 'tests/sales_tax_7b_v2_projection.test.cjs'
      - '.github/workflows/sales-tax-7b-v2.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  v2-tax-projection:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax and frozen VAT baseline
        run: |
          node --check nomad360_sales_tax_v2.js
          node --check tests/sales_tax_7b_v2_projection.test.cjs
          node tests/sales_tax_7b_baseline.cjs
      - name: V2 Sales Tax pure contracts and both historical V2 models
        run: |
          node --test tests/sales_tax_7b_v2_projection.test.cjs tests/portfolio_v2_engine.test.cjs tests/portfolio_v2_online_adapter.test.cjs
