name: Temporary simple service L0 refresh
on:
  push:
    branches:
      - fix/service-simple-examples-and-reset
    paths:
      - .github/workflows/refresh-simple-service-inventory.yml
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/service-simple-examples-and-reset
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --prefix scripts/localization
      - run: node scripts/localization/inventory.cjs
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/localization/l0
          if ! git diff --cached --quiet; then
            git commit -m "chore(l10n): regenerate examples inventory on current main"
            git push origin HEAD:fix/service-simple-examples-and-reset
          fi
