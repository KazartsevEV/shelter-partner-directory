name: TYPE-02 one-time L0 inventory refresh
on:
  push:
    branches: [feature/type02-typography]
    paths: [.github/workflows/type02-l0-refresh.yml]
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/type02-typography
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Refresh generated L0 source inventory and remove this one-time workflow
        run: |
          set -euo pipefail
          npm ci --prefix scripts/localization --ignore-scripts --no-audit --no-fund
          node scripts/localization/inventory.cjs
          node scripts/localization/inventory.cjs --check
          git rm .github/workflows/type02-l0-refresh.yml
          git add docs/localization/l0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(TYPE-02): regenerate localization inventory for presentation CSS"
          git push origin HEAD:feature/type02-typography
