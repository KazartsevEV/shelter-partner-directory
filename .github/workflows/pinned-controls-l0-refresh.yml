name: Temporary PINNED-CONTROLS L0 inventory refresh
on:
  push:
    branches: ['feature/pinned-navigation-swipe-bug-widget']
    paths:
      - '.github/workflows/pinned-controls-l0-refresh.yml'
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Refresh current branch checkout
        run: |
          git fetch origin refs/heads/feature/pinned-navigation-swipe-bug-widget:refs/remotes/origin/feature/pinned-navigation-swipe-bug-widget
          git checkout -B feature/pinned-navigation-swipe-bug-widget origin/feature/pinned-navigation-swipe-bug-widget
      - name: Rebuild deterministic L0
        run: |
          npm ci --prefix scripts/localization --ignore-scripts --no-audit --no-fund
          node scripts/localization/inventory.cjs
      - name: Commit only refreshed L0 entries
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/localization/l0
          if ! git diff --cached --quiet; then
            git commit -m "chore(ui): refresh deterministic pinned controls locale inventory"
            git push origin HEAD:feature/pinned-navigation-swipe-bug-widget
          fi
