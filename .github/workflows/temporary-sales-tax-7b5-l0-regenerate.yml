name: TEMP SALES-TAX-7B5 regenerate L0 inventory
on:
  pull_request:
    paths:
      - '.github/workflows/temporary-sales-tax-7b5-l0-regenerate.yml'
permissions:
  contents: write
jobs:
  regenerate:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/sales-tax-7b-5-ui-export
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install official parser dependencies
        run: npm ci --prefix scripts/localization --ignore-scripts --no-audit --no-fund
      - name: Generate and deterministically verify L0 from actual branch sources
        run: |
          node scripts/localization/inventory.cjs
          node scripts/localization/inventory.cjs --check
      - name: Commit only regenerated L0 records
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/localization/l0
          if git diff --cached --quiet; then
            echo "L0 inventory already current"
          else
            git commit -m "l10n(7B5): regenerate deterministic L0 after tax UI and export"
            git push origin HEAD:refs/heads/feature/sales-tax-7b-5-ui-export
          fi
