name: HERO-LANG temporary regenerate locale catalogue
on:
  pull_request:
    paths:
      - '.github/workflows/hero-lang-rebuild-l0.yml'
permissions:
  contents: write
jobs:
  refresh:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'fix/hero-english-default-language-order-cta-20261020'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --prefix scripts/localization --ignore-scripts --no-audit --no-fund
      - run: node scripts/localization/inventory.cjs
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/localization/l0/
          if ! git diff --cached --quiet; then
            git commit -m "chore(l10n): refresh L0 with restored navigator-preferred locale"
            git push origin "HEAD:${{ github.head_ref }}"
          fi
