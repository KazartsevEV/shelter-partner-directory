name: HERO-LANG browser choice L0 refresh
on:
  pull_request:
    paths:
      - '.github/workflows/hero-lang-browser-l0-refresh.yml'
permissions:
  contents: write
jobs:
  refresh-l0:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'fix/hero-english-default-language-order-cta-20261020'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install inventory dependencies
        run: npm ci --prefix scripts/localization --ignore-scripts --no-audit --no-fund
      - name: Generate source inventory
        run: node scripts/localization/inventory.cjs
      - name: Commit generated L0 only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/localization/l0/
          if ! git diff --cached --quiet; then
            git commit -m "chore(locale): sync inventory after restoring browser-language choice"
            git push origin "HEAD:${{ github.head_ref }}"
          fi
