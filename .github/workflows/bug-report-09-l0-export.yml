name: Nomad360 task 09 L0 regenerate evidence (temporary)
on:
  pull_request:
    paths:
      - '.github/workflows/bug-report-09-l0-export.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  regenerate:
    if: github.event.pull_request.number == 174 && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/bug-report-widget-09
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --prefix scripts/localization --ignore-scripts --no-audit --no-fund
      - name: Rebuild deterministic source census
        run: |
          node scripts/localization/inventory.cjs
          tar -czf task09-localization-generated.tgz docs/localization/l0
      - name: Commit generated census only to Task 09 branch
        run: |
          unexpected=$(git diff --name-only | grep -v '^docs/localization/l0/' || true)
          if [ -n "$unexpected" ]; then
            echo "Unexpected source modifications: $unexpected" >&2; exit 1
          fi
          git add -A docs/localization/l0
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'chore(task09): refresh generated L0 census'
            git push origin HEAD:refs/heads/feature/bug-report-widget-09
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: task09-generated-l0
          path: task09-localization-generated.tgz
          retention-days: 7
