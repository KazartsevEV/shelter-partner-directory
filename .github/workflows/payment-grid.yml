name: C5-6 canonical footer fiat support grid
on:
  pull_request:
    paths:
      - 'nomad360_calculator_ui.css'
      - 'scripts/cleanup-payment-grid/**'
      - 'tests/payment_grid.test.cjs'
      - 'scripts/localization/inventory.cjs'
      - 'tests/fixtures/payment-grid/**'
      - 'tests/helpers/payment-grid-scope.cjs'
      - 'docs/reviews/payment-grid-05-6/**'
      - '.github/workflows/payment-grid.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  payment-grid:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NODE_PATH: ${{ github.workspace }}/scripts/palette/node_modules
      C56_BASELINE_ROOT: ${{ github.workspace }}/.c56-baseline
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Locked tools and accepted main
        run: |
          npm ci --prefix scripts/palette --ignore-scripts --no-audit --no-fund
          npm ci --prefix scripts/localization --ignore-scripts --no-audit --no-fund
          scripts/palette/node_modules/.bin/playwright install --with-deps chromium
          git worktree add --detach "$C56_BASELINE_ROOT" 5e2b37431948f7d866ba18809d45bda4ddc74d05
      - name: Exact component boundary, negative guards and financial contracts
        run: |
          node --check scripts/cleanup-payment-grid/compare.cjs
          node --test tests/payment_grid.test.cjs tests/style_ownership.test.cjs tests/cleanup_about_copy.test.cjs tests/cleanup_scene_layout.test.cjs tests/cleanup_scene.test.cjs tests/cleanup_canvas.test.cjs tests/cleanup_palette.test.cjs tests/cleanup_about.test.cjs tests/cleanup_logo_mask.test.cjs tests/partner_build_scope.test.cjs tests/banner_vector_quality.test.cjs tests/task10_palette_source.test.cjs tests/nomad360_marketing_scope.test.cjs tests/nomad360_v1_engine.test.cjs tests/nomad360_v1_engine_scope.test.cjs tests/nomad360_draft_store.test.cjs tests/tax_draft_storage_scope.test.cjs tests/portfolio_v2_engine.test.cjs tests/portfolio_v2_linked.test.cjs tests/nomad360_price_export.test.cjs
          node scripts/palette/build.cjs --check
          node scripts/localization/inventory.cjs --check
          node tests/sales_tax_7b_baseline.cjs
          node tests/helpers/pinned-controls-css-scope.cjs
          python scripts/seo/check_phase_a.py
          node scripts/cleanup-payment-grid/ownership.cjs artifacts/payment-grid/ownership.json
      - name: Pinned site utilities
        run: |
          mkdir -p artifacts/payment-grid
          printf '@tailwind base;\n@tailwind components;\n@tailwind utilities;\n' > "$RUNNER_TEMP/c56.css"
          scripts/palette/node_modules/.bin/tailwindcss -i "$RUNNER_TEMP/c56.css" -o artifacts/payment-grid/utilities.css --content './Marketing_calc.HTML,./portfolio_v2_*ui.js,./nomad360_*.js' --minify
      - name: Real fiat grid before/after, bank disclosure, hover, keyboard focus and responsive boundary
        run: |
          node scripts/cleanup-payment-grid/compare.cjs artifacts/payment-grid
          node scripts/cleanup-payment-grid/capture-classic.cjs artifacts/payment-grid
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: payment-grid-canvas-${{ github.sha }}
          path: |
            artifacts/payment-grid/*.json
            artifacts/payment-grid/*.png
          retention-days: 14
