name: SALES-TAX-07B stage 5 UI and export parity
on:
  pull_request:
    paths:
      - 'Marketing_calc.HTML'
      - 'nomad360_price_export.js'
      - 'nomad360_calculator_ui.js'
      - 'nomad360_sales_tax_v1.js'
      - 'nomad360_sales_tax_service_v1.js'
      - 'portfolio_v2_ui.js'
      - 'portfolio_v2_linked_ui.js'
      - 'nomad360_locale_core.js'
      - 'tests/sales_tax_7b5*'
      - '.github/workflows/sales-tax-7b5-export.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tax-export:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax, independent tax projection and historical VAT contract
        run: |
          node --check nomad360_price_export.js
          node --check nomad360_calculator_ui.js
          node --test tests/sales_tax_7b5_price_export.test.cjs tests/nomad360_price_export.test.cjs tests/sales_tax_7b_v2_projection.test.cjs
          node tests/sales_tax_7b_baseline.cjs
      - name: Check protected historical finance engines unchanged
        run: |
          git fetch --no-tags origin main
          if git diff --name-only origin/main...HEAD -- portfolio_v2_engine.js portfolio_v2_linked_engine.js portfolio_v2_full_service.js portfolio_v2_temporal_cash.js portfolio_v2_period_price.js portfolio_v2_online_adapter.js | grep .; then
            echo "Legacy finance engine modified during stage 7B-5" >&2
            exit 1
          fi
      - name: Install pinned Chromium
        run: |
          npm install --no-save --package-lock=false playwright@1.58.0 tailwindcss@3.4.17
          npx playwright install --with-deps chromium
      - name: Existing V2 Sales Tax browser and VAT paths
        run: node tests/sales_tax_7b_v2_browser.cjs
