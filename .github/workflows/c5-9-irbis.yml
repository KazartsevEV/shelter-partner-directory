name: C5-9 IRBIS footer geometry consolidation
on:
  pull_request:
    paths:
      - "nomad360_irbis_banner.css"
      - "tests/c5_9_irbis_scope.test.cjs"
      - "tests/c5_9_irbis_browser.cjs"
      - ".github/workflows/c5-9-irbis.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  irbis:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Locked CSS parser and Chromium
        run: |
          npm ci --prefix scripts/palette --ignore-scripts --no-audit --no-fund
          scripts/palette/node_modules/.bin/playwright install --with-deps chromium
      - name: Exact historic boundary and cascade winners
        run: node --test tests/c5_9_irbis_scope.test.cjs
      - name: Paired live IRBIS browser, 2 entries x 5 widths x 3 languages
        run: node tests/c5_9_irbis_browser.cjs
      - name: Financial and tax guards
        run: |
          node --test tests/nomad360_v1_engine.test.cjs tests/portfolio_v2_engine.test.cjs tests/nomad360_draft_store.test.cjs
          node tests/sales_tax_7b_baseline.cjs
