name: Unified banners functional and financial parity
on:
  pull_request:
    paths:
      - 'Marketing_calc.HTML'
      - 'nomad360_banners.js'
      - 'nomad360_calculator_ui.css'
      - 'nomad360_header.js'
      - 'assets/nomad360-banners/**'
      - 'tests/unified_banners*'
      - 'tests/fixtures/unified-banners/**'
      - 'tests/helpers/unified-banners-contract.cjs'
      - '.github/workflows/unified-banners.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  visual-and-actions:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --prefix scripts/localization --ignore-scripts --no-audit --no-fund
      - name: Syntax, immutable source/evidence, existing scope and language inventory
        run: |
          node --check nomad360_banners.js
          node --check nomad360_header.js
          node --test tests/unified_banners_scope.test.cjs tests/return_7a_scope.test.cjs tests/nomad360_marketing_scope.test.cjs tests/type02_scope.test.cjs tests/nomad360_locale_semantic.test.cjs tests/seo_language.test.cjs
          node scripts/localization/inventory.cjs --check
      - name: Pinned Chromium and offline CSS
        run: |
          npm install --no-save --package-lock=false playwright@1.58.0 tailwindcss@3.4.17
          npx playwright install --with-deps chromium
          mkdir -p artifacts/unified-banners artifacts/return-7a
          printf '@tailwind base;\n@tailwind components;\n@tailwind utilities;\n' > /tmp/unified-utilities.css
          npx tailwindcss -i /tmp/unified-utilities.css --content './Marketing_calc.HTML,./nomad360_*.js,./portfolio_v2_*ui.js' -o artifacts/unified-banners/utilities.css --minify
          cp artifacts/unified-banners/utilities.css artifacts/return-7a/utilities.css
      - name: 21 locale/viewport cases against the pre-change observations
        run: |
          node tests/unified_banners_browser.cjs
          node tests/unified_banners_contrast.cjs
          node tests/unified_banners_financial_links.cjs
      - name: Existing real downloads, keyboard, native-event branches and portable HTML
        run: |
          RET_STAGE=all node tests/return_7a_browser.cjs
          node tests/nomad360_calculator_ui_browser.test.cjs
          node tests/nomad360_embed_footer_browser.test.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unified-banners-visual-actions
          path: |
            docs/reviews/unified-banners-01/revision-2
            artifacts/unified-banners
            artifacts/return-7a
            artifacts/donation-footer
  finance-and-exports:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Existing finance and unchanged historical VAT
        run: |
          node --test tests/sales_tax_7b6_final_audit.test.cjs tests/sales_tax_7b_pure.test.cjs tests/sales_tax_7b_v2_projection.test.cjs tests/sales_tax_7b5_price_export.test.cjs tests/v1_service_v2_numeric_parity.test.cjs tests/portfolio_v2_engine.test.cjs tests/portfolio_v2_linked.test.cjs tests/portfolio_v2_period_price.test.cjs tests/portfolio_v2_temporal_cash.test.cjs tests/nomad360_price_export.test.cjs
          node tests/sales_tax_7b_baseline.cjs
      - name: Pinned Chromium and identical historical utility CSS
        run: |
          npm install --no-save --package-lock=false playwright@1.58.0 tailwindcss@3.4.17
          npx playwright install --with-deps chromium
          mkdir -p artifacts/sales-tax-7b
          printf '@tailwind base;\n@tailwind components;\n@tailwind utilities;\n' > /tmp/unified-vat-utilities.css
          npx tailwindcss -i /tmp/unified-vat-utilities.css --content './Marketing_calc.HTML,./nomad360_*.js,./portfolio_v2_*ui.js' -o artifacts/sales-tax-7b/utilities.css --minify
      - name: Original 78 VAT scenarios and exact full pre-design receipts
        run: |
          node tests/sales_tax_7b_vat_browser.cjs
          node tests/unified_banners_vat_receipts.cjs
      - name: Sales Tax, no-tax, services, restore and actual XLSX/PDF contents
        run: |
          node tests/sales_tax_7b_goods_browser.cjs
          node tests/sales_tax_7b_services_browser.cjs
          node tests/sales_tax_7b_v2_browser.cjs
          node tests/sales_tax_7b5_v1_pdf_browser.cjs
          node tests/sales_tax_7b5_v2_export_browser.cjs
          node tests/simple_service_examples_browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unified-banners-finance-parity
          path: artifacts/sales-tax-7b
