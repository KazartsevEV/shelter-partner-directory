name: One-time L0 inventory sync for B2B and About copy
on:
  push:
    branches:
      - fix/b2b-comparison-copy
    paths:
      - '.github/workflows/sync-l0-once.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install localization tools
        run: npm ci --prefix scripts/localization --ignore-scripts --no-audit --no-fund
      - name: Regenerate inventory and remove this temporary workflow in same commit
        run: |
          node scripts/localization/inventory.cjs
          rm .github/workflows/sync-l0-once.yml
          git add -A docs/localization/l0 .github/workflows/sync-l0-once.yml
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "chore(l10n): regenerate L0 source inventory for B2B/About updates"
            git push origin HEAD:fix/b2b-comparison-copy
          fi
