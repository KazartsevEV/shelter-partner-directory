name: TEMP SALES TAX 7B5 source L0 resync
on:
  pull_request:
    paths:
      - 'nomad360_calculator_ui.js'
      - '.github/workflows/temporary-7b5-l0-resync.yml'
permissions:
  contents: write
jobs:
  regenerate:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/sales-tax-7b-5-ui-export
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --prefix scripts/localization --ignore-scripts --no-audit --no-fund
      - name: Regenerate catalog from actual source and verify
        run: |
          node scripts/localization/inventory.cjs
          node scripts/localization/inventory.cjs --check
      - name: Commit only generated L0 catalog
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/localization/l0
          if git diff --cached --quiet; then
            echo "L0 current"
          else
            git commit -m "l10n(7B5): regenerate L0 after principal PDF localization"
            git fetch origin feature/sales-tax-7b-5-ui-export
            git rebase origin/feature/sales-tax-7b-5-ui-export
            git push origin HEAD:refs/heads/feature/sales-tax-7b-5-ui-export
          fi
