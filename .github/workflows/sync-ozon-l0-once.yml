name: Sync Nomad360 localization inventory once
on:
  push:
    branches: [fix/b2b-comparison-copy]
    paths: ['.github/workflows/sync-ozon-l0-once.yml']
permissions:
  contents: write
jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --prefix scripts/localization --ignore-scripts --no-audit --no-fund
      - name: Regenerate inventory and remove temporary workflow
        run: |
          node scripts/localization/inventory.cjs
          rm .github/workflows/sync-ozon-l0-once.yml
          git add -A docs/localization/l0 .github/workflows/sync-ozon-l0-once.yml
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "chore(l10n): sync Russian Ozon support inventory"
            git push origin HEAD:fix/b2b-comparison-copy
          fi
