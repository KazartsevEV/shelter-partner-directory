name: C2 mobile logo-mask paired cleanup acceptance
on:
  pull_request:
    paths:
      - 'nomad360_calculator_ui.css'
      - 'scripts/cleanup-logo-mask/**'
      - 'tests/cleanup_logo_mask.test.cjs'
      - 'tests/helpers/cleanup-logo-mask-scope.cjs'
      - 'tests/helpers/accepted-banner-248-scope.cjs'
      - 'docs/reviews/cleanup-logo-mask-02/**'
      - '.github/workflows/cleanup-logo-mask.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  logo-mask:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NODE_PATH: ${{ github.workspace }}/scripts/palette/node_modules
      C2_BASELINE_ROOT: ${{ github.workspace }}/.c2-baseline
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Pinned tools and accepted main
        run: |
          npm ci --prefix scripts/palette --ignore-scripts --no-audit --no-fund
          npm ci --prefix scripts/localization --ignore-scripts --no-audit --no-fund
          scripts/palette/node_modules/.bin/playwright install --with-deps chromium
          git worktree add --detach "$C2_BASELINE_ROOT" 6ce82985d46f9d29c4f7312753d1a0b62714a19a
      - name: Strict source, original logo, palette, localization and financial contracts
        run: |
          node --check scripts/cleanup-logo-mask/compare.cjs
          node --test tests/cleanup_logo_mask.test.cjs tests/partner_build_scope.test.cjs tests/task10_palette_source.test.cjs tests/nomad360_marketing_scope.test.cjs tests/nomad360_v1_engine.test.cjs tests/nomad360_v1_engine_scope.test.cjs tests/nomad360_draft_store.test.cjs tests/tax_draft_storage_scope.test.cjs tests/portfolio_v2_engine.test.cjs tests/portfolio_v2_linked.test.cjs tests/nomad360_price_export.test.cjs
          node tests/helpers/pinned-controls-css-scope.cjs
          node scripts/palette/build.cjs --check
          node scripts/localization/inventory.cjs --check
          node tests/sales_tax_7b_baseline.cjs
          python scripts/seo/check_phase_a.py
      - name: Pinned utilities
        run: |
          mkdir -p artifacts/cleanup-c2
          printf '@tailwind base;\n@tailwind components;\n@tailwind utilities;\n' > "$RUNNER_TEMP/c2.css"
          scripts/palette/node_modules/.bin/tailwindcss -i "$RUNNER_TEMP/c2.css" -o artifacts/cleanup-c2/utilities.css --content './Marketing_calc.HTML,./portfolio_v2_*ui.js,./nomad360_*.js' --minify
      - name: Actual logo, header/menu/embed and offline package before/after
        run: node scripts/cleanup-logo-mask/compare.cjs artifacts/cleanup-c2
      - name: Real Excel downloads and print projection
        run: |
          cp artifacts/cleanup-c2/utilities.css artifacts/excel-utilities.css
          node tests/nomad360_price_export_browser.test.cjs
          node tests/sales_tax_7b5_v1_pdf_browser.cjs | tee artifacts/cleanup-c2/pdf.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cleanup-c2-${{ github.sha }}
          path: |
            artifacts/cleanup-c2/*.json
            artifacts/cleanup-c2/*.png
            artifacts/cleanup-c2/*.log
            artifacts/excel/*.json
            artifacts/excel/*.xlsx
          retention-days: 14
