name: Pinned navigation and swipe bug launcher
on:
  pull_request:
    paths:
      - 'nomad360_calculator_ui.css'
      - 'nomad360_bug_report.css'
      - 'nomad360_bug_report.js'
      - 'tests/pinned_controls_browser.cjs'
      - 'tests/helpers/pinned-controls-css-scope.cjs'
      - '.github/workflows/pinned-controls.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pinned-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax and restricted CSS diff
        run: |
          node --check nomad360_bug_report.js
          node --check tests/pinned_controls_browser.cjs
          git fetch --no-tags origin main
          node tests/helpers/pinned-controls-css-scope.cjs
      - name: Install Chromium
        run: |
          npm install --prefix "$RUNNER_TEMP/pinned" --no-save --no-package-lock playwright@1.58.0
          "$RUNNER_TEMP/pinned/node_modules/.bin/playwright" install --with-deps chromium
      - name: Sticky header, swipe, keyboard, locales, viewport screenshots
        env:
          NODE_PATH: ${{ runner.temp }}/pinned/node_modules
        run: node tests/pinned_controls_browser.cjs
      - name: Screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pinned-navigation-and-bug-widget
          path: artifacts/pinned-controls/*.png
          retention-days: 14
