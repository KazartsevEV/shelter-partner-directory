name: SALES-TAX-07B frozen VAT baseline
on:
  pull_request:
    paths:
      - 'docs/reviews/sales-tax-7b/**'
      - 'tests/sales_tax_7b_*'
      - 'tests/fixtures/sales-tax-7b/**'
      - '.github/workflows/sales-tax-7b-baseline.yml'
      - 'Marketing_calc.HTML'
      - 'portfolio_v2_*.js'
      - 'nomad360_*.js'
      - 'nomad360_*.css'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  baseline-engine:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate frozen SHA-256 manifest
        run: |
          python3 - <<'PY'
          import hashlib,json,pathlib
          root=pathlib.Path('docs/reviews/sales-tax-7b')
          d=json.loads((root/'baseline-manifest.json').read_text())
          bad=[]
          for name,wanted in d['files'].items():
              p=root/name
              if not p.is_file() or hashlib.sha256(p.read_bytes()).hexdigest()!=wanted:
                  bad.append(name)
          assert not bad, f'Changed/missing frozen VAT evidence: {bad[:15]}'
          print(f'VAT_BASELINE_MANIFEST_GREEN files={len(d["files"])} source={d["source"]}')
          PY
      - name: Check immutable baseline test syntax and V2 engine parity
        run: |
          node --check tests/sales_tax_7b_baseline.cjs
          node --check tests/sales_tax_7b_vat_browser.cjs
          node tests/sales_tax_7b_baseline.cjs
  baseline-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned Playwright and Tailwind
        run: |
          npm install --prefix "$RUNNER_TEMP/sales-tax-tools" --no-save --no-package-lock playwright@1.58.0 tailwindcss@3.4.17
          "$RUNNER_TEMP/sales-tax-tools/node_modules/.bin/playwright" install --with-deps chromium
          mkdir -p artifacts/sales-tax-7b
          printf '@tailwind base;\n@tailwind components;\n@tailwind utilities;\n' > "$RUNNER_TEMP/sales-tax-utilities.css"
          "$RUNNER_TEMP/sales-tax-tools/node_modules/.bin/tailwindcss" -i "$RUNNER_TEMP/sales-tax-utilities.css" --content './Marketing_calc.HTML,./nomad360_*.js,./portfolio_v2_*ui.js' -o artifacts/sales-tax-7b/utilities.css --minify
      - name: Compare current V1/V2 VAT UI, restore, PDF and XLSX against frozen baseline
        env:
          NODE_PATH: ${{ runner.temp }}/sales-tax-tools/node_modules
        run: node tests/sales_tax_7b_vat_browser.cjs
      - name: Upload comparison receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sales-tax-7b-vat-baseline-after
          path: artifacts/sales-tax-7b/
