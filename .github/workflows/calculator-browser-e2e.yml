name: Calculator numeric Chromium audit

on:
  pull_request:
    paths:
      - "Marketing_calc.HTML"
      - "tests/marketing_calc_browser_e2e.cjs"
      - "tests/marketing_calc_prefilled_demo.test.cjs"
      - "tests/marketing_calc_two_sku_demo.test.cjs"
      - "tests/marketing_calc_first_user_journey.test.cjs"
      - "tests/marketing_calc_dropship_browser.test.cjs"
      - "tests/portfolio_v2_linked_browser.test.cjs"
      - "tests/portfolio_v2_temporal_browser.test.cjs"
      - "tests/portfolio_v2_temporal_cash_browser.test.cjs"
      - "tests/portfolio_v2_pooled_media_browser.test.cjs"
      - "tests/portfolio_v2_period_pnl_browser.test.cjs"
      - "tests/portfolio_v2_period_price_browser.test.cjs"
      - "tests/portfolio_v2_f3_fixture.cjs"
      - "tests/portfolio_v2_f3_mixed_browser.test.cjs"
      - "tests/portfolio_v2_f4_release_browser.test.cjs"
      - "tests/nomad360_calculator_ui_browser.test.cjs"
      - "tests/nomad360_embed_footer_browser.test.cjs"
      - "nomad360_header.js"
      - "nomad360_calculator_ui.js"
      - "nomad360_locale_core.js"
      - "tests/nomad360_locale_core_browser.test.cjs"
      - "tests/nomad360_locale_product_numbers_browser.test.cjs"
      - "tests/nomad360_locale_v1_aggregate_cash_browser.test.cjs"
      - "tests/nomad360_locale_v1_final_prices_browser.test.cjs"
      - "tests/nomad360_locale_v1_hidden_errors_browser.test.cjs"
      - "tests/nomad360_locale_release_matrix_browser.test.cjs"
      - "nomad360_calculator_ui.css"
      - ".github/workflows/calculator-portfolio-probe.yml"
      - ".github/workflows/portfolio-v2.yml"
      - ".github/workflows/calculator-tests.yml"
      - "portfolio_v2_period_price.js"
      - "portfolio_v2_temporal_cash.js"
      - "portfolio_v2_period_price.js"
      - "portfolio_v2_pooled_media.js"
      - "portfolio_v2_temporal_cash.js"
      - "portfolio_v2_temporal.js"
      - "tests/portfolio_v2_resource_lifecycle_browser.test.cjs"
      - "tests/marketing_calc_offline_service_browser.test.cjs"
      - "tests/marketing_calc_add_next_service_browser.test.cjs"
      - "tests/calculator_business_oracle_browser.test.cjs"
      - "portfolio_v2_linked_ui.js"
      - "tests/portfolio_v2_mba_capacity_browser.test.cjs"
      - "tests/portfolio_v2_online_browser.test.cjs"
      - "portfolio_v2_online_adapter.js"
      - "portfolio_v2_linked_engine.js"
      - "portfolio_v2_basket_ui.js"
      - "portfolio_v2_mba_observed.js"
      - "portfolio_v2_mba_observed_ui.js"
      - "tests/portfolio_v2_mba_observed.test.cjs"
      - "tests/portfolio_v2_mba_browser.test.cjs"
      - "tests/marketing_calc_inline_errors.test.cjs"
      - ".github/workflows/calculator-browser-e2e.yml"
  push:
    branches: ["main"]
    paths:
      - "nomad360_locale_core.js"
      - "nomad360_calculator_ui.js"
      - "nomad360_calculator_ui.css"
      - "tests/nomad360_calculator_ui_browser.test.cjs"
      - "Marketing_calc.HTML"
      - "portfolio_v2_linked_ui.js"
      - "portfolio_v2_period_price.js"
      - "portfolio_v2_temporal_cash.js"
      - "tests/portfolio_v2_f4_release_browser.test.cjs"
      - ".github/workflows/calculator-portfolio-probe.yml"
      - ".github/workflows/portfolio-v2.yml"
      - ".github/workflows/calculator-tests.yml"
      - ".github/workflows/calculator-browser-e2e.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install browser test runner
        run: npm install --no-save --no-package-lock playwright@1.58.0
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run exact top-to-bottom numeric audit
        run: |
          node tests/nomad360_locale_core_browser.test.cjs
          node tests/nomad360_locale_product_numbers_browser.test.cjs
          node tests/nomad360_locale_v1_aggregate_cash_browser.test.cjs
          node tests/nomad360_locale_v1_final_prices_browser.test.cjs
          node tests/nomad360_locale_v1_hidden_errors_browser.test.cjs
          node tests/nomad360_locale_release_matrix_browser.test.cjs
          node tests/marketing_calc_browser_e2e.cjs
          node tests/marketing_calc_prefilled_demo.test.cjs
          node tests/marketing_calc_two_sku_demo.test.cjs
          node tests/marketing_calc_first_user_journey.test.cjs
          node tests/marketing_calc_inline_errors.test.cjs
          node tests/marketing_calc_dropship_browser.test.cjs
          node tests/portfolio_v2_linked_browser.test.cjs
          node tests/portfolio_v2_temporal_browser.test.cjs
          node tests/portfolio_v2_temporal_cash_browser.test.cjs
          node tests/portfolio_v2_pooled_media_browser.test.cjs
          node tests/portfolio_v2_period_pnl_browser.test.cjs
          node tests/portfolio_v2_period_price_browser.test.cjs
          node tests/portfolio_v2_f3_mixed_browser.test.cjs
          node tests/portfolio_v2_f4_release_browser.test.cjs
          node tests/nomad360_calculator_ui_browser.test.cjs
          node tests/nomad360_embed_footer_browser.test.cjs
          node tests/portfolio_v2_resource_lifecycle_browser.test.cjs
          node tests/portfolio_v2_mba_capacity_browser.test.cjs
          node tests/portfolio_v2_mba_browser.test.cjs
          node tests/portfolio_v2_online_browser.test.cjs
          node tests/marketing_calc_offline_service_browser.test.cjs
          node tests/marketing_calc_add_next_service_browser.test.cjs
          node --test tests/calculator_business_oracle_browser.test.cjs
