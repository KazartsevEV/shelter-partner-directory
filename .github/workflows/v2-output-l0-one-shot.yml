name: TEMP V2 truth regenerate locale inventory
on:
  pull_request:
    paths:
      - '.github/workflows/v2-output-l0-one-shot.yml'
      - 'portfolio_v2_ui.js'
      - 'portfolio_v2_us_demo_ui.js'
permissions:
  contents: write
jobs:
  regenerate:
    if: github.event.pull_request.number == 190 && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate exact audited L0 from current UI
        run: |
          npm ci --prefix scripts/localization --ignore-scripts --no-audit --no-fund
          node scripts/localization/inventory.cjs
          node scripts/localization/inventory.cjs --check
      - name: Commit exclusively generated locale inventory
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/localization/l0/
          if ! git diff --cached --quiet; then
            git commit -m 'chore(v2 truth): regenerate exact L0 inventory after canonical kk heading'
            git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
          fi
