<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TYPE-02 B — сравнение Inter</title><style>body{margin:24px;font:16px/1.5 system-ui;color:#16375a}label{display:inline-block;margin:0 16px 16px 0}select,button{font:inherit;min-height:44px}main{display:flex;gap:24px;align-items:flex-start}figure{margin:0;flex:1;min-width:0}img{max-width:100%;height:auto;border:1px solid #94a5b7}figcaption{margin:8px 0;font-weight:600}@media(max-width:600px){main{display:block}figure{margin-bottom:20px}}</style><h1>TYPE-02 B · Inter</h1><p>Оригинальные Chromium PNG. До — принятый main b1cc9b50; после — CI реализации 0b22fe2e.</p><label>Язык <select id="lang"><option>ru</option><option>en</option><option>kk</option></select></label><label>Ширина <select id="width"><option>320</option><option>390</option><option>768</option><option>1280</option></select></label><label>Экран <select id="view"><option value="home-0">Hero</option><option value="home-1">Валюта бизнеса</option><option value="home-2">About</option><option value="home-3">Контакты</option><option value="standalone-0">Закупка / сертификаты V2</option><option value="linked-1">Результаты связанного V2</option></select></label><main><figure><figcaption>До</figcaption><img id="before" alt="Исходная типографика"></figure><figure><figcaption>После · Inter</figcaption><img id="after" alt="Принятый Inter"></figure></main><script>const embedded={};const language=document.getElementById('lang'),viewport=document.getElementById('width'),screen=document.getElementById('view');function render(){for(const variant of ['before','after']){const name=language.value+'-'+viewport.value+'-'+variant+'-'+screen.value+'.png';document.getElementById(variant).src=embedded[name]||name;}}document.querySelectorAll('select').forEach(s=>s.addEventListener('change',render));render();</script></html>
